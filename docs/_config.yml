# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: David Millard
email: david.millard@rochester.edu
description: >- # this means to ignore newlines until "baseurl:"
  Research website of David Millard, a Ph.D. student in Electrical and Computer Engineering at the University of Rochester working in machine learning, scientific computing, controls, and audio.
domain: djm3622.github.io       # if you want to force HTTPS, specify the domain without the http at the start, e.g. example.com
url: https://djm3622.github.io  # the base hostname and protocol for your site, e.g. http://example.com
github_username:  djm3622

author:
  name: David Millard
  job_title: Ph.D. Student in Electrical and Computer Engineering
  affiliation: University of Rochester
  image: /assets/images/my_pfp.jpg
  github: https://github.com/djm3622
  google_scholar: https://scholar.google.com/citations?user=LEs7ELgAAAAJ&hl=en
  linkedin: https://www.linkedin.com/in/david-millard-77b214243/
  knows_about:
    - Machine learning
    - Scientific computing
    - Control systems
    - Physical modeling
    - Automatic music transcription
    - Digital watermarking
    - Text-to-speech

header_pages:
  - index.markdown
  - about.markdown
  - publications.markdown
  - presentations.markdown
  - music.markdown
  - plugins.markdown

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
