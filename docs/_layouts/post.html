---
layout: default
---
<article class="update-card h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="update-header">
    <p class="update-kicker">Research update</p>
    <h1 class="update-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="update-date">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {%- assign date_format = site.minima.date_format | default: "%B %-d, %Y" -%}
        {{ page.date | date: date_format }}
      </time>
    </p>
  </header>

  <div class="update-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <footer class="update-footer">
    <a href="{{ '/' | relative_url }}">&larr; Back to all updates</a>
  </footer>
</article>

<style>
  .update-card {
    margin-top: 18px;
    padding: 32px;
    background: linear-gradient(145deg, var(--site-surface-soft) 0%, var(--site-surface) 54%);
    border: 1px solid var(--site-border);
    border-radius: 16px;
    box-shadow: 0 8px 26px var(--site-shadow);
  }

  .update-kicker {
    margin: 0 0 9px;
    color: var(--site-accent);
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .update-title {
    max-width: 720px;
    margin: 0;
    color: var(--site-heading);
    font-size: clamp(1.55rem, 5vw, 2.1rem);
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 1.25;
  }

  .update-date {
    margin: 10px 0 0;
    color: var(--site-muted-soft);
    font-size: 0.86rem;
  }

  .update-content {
    margin-top: 26px;
    color: var(--site-text);
    font-size: 1.03rem;
    line-height: 1.72;
  }

  .update-content a {
    color: var(--site-accent-strong);
    font-weight: 600;
  }

  .update-footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--site-border);
  }

  .update-footer a {
    color: var(--site-accent-strong);
    font-size: 0.9rem;
    font-weight: 600;
  }

  @media (max-width: 650px) {
    .update-card {
      margin-top: 4px;
      padding: 22px 17px;
    }

    .update-content {
      margin-top: 21px;
      font-size: 1rem;
    }
  }
</style>
