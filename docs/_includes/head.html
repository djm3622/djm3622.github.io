<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- include site-meta.html -%}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon-waveform.png' | relative_url }}" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" sizes="180x180">
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('david-millard-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (error) {
        // The system preference remains the fallback when storage is unavailable.
      }
    }());
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --site-bg: #fdfdfd;
      --site-surface: #ffffff;
      --site-surface-soft: #f8fbfa;
      --site-surface-muted: #eef2f4;
      --site-hero-start: #f6faf9;
      --site-hero-end: #ffffff;
      --site-text: #22272e;
      --site-heading: #1f2937;
      --site-muted: #607083;
      --site-muted-soft: #718096;
      --site-border: #dce4ec;
      --site-border-strong: #9bc9c7;
      --site-accent: #178d8f;
      --site-accent-strong: #0f7075;
      --site-accent-soft: #e4f5f3;
      --site-button-text: #ffffff;
      --site-shadow: rgba(22, 105, 103, 0.09);
    }

    html,
    body {
      margin: 0;
      background-color: var(--site-bg);
      color: var(--site-text);
    }

    .wrapper {
      max-width: 840px;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--site-heading);
    }

    a, a:visited {
      color: var(--site-accent-strong);
    }

    a:hover {
      color: var(--site-accent);
    }

    .site-header,
    .site-footer {
      background: var(--site-bg);
      border-color: var(--site-border);
    }

    .site-header {
      min-height: 61px;
      border-top: 0;
      border-bottom: 1px solid var(--site-border);
      box-shadow: none;
    }

    .site-header .wrapper {
      position: relative;
    }

    .site-nav .page-link,
    .site-nav .page-link:visited {
      color: var(--site-muted);
    }

    .site-nav {
      line-height: 60px;
    }

    .site-footer {
      padding: 12px 0;
    }

    .compact-footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 16px;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .compact-footer-links a {
      color: var(--site-muted);
      white-space: nowrap;
    }

    .compact-footer-links a:hover {
      color: var(--site-accent);
      text-decoration: none;
    }

    .site-nav .page-link.active {
      color: var(--site-accent);
      font-weight: 650;
    }

    .theme-toggle {
      display: inline-grid;
      float: right;
      width: 32px;
      height: 32px;
      margin: 14px 0 0;
      padding: 0;
      place-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--site-muted);
      cursor: pointer;
      font: inherit;
      font-size: 1.15rem;
      line-height: 1;
      vertical-align: middle;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .theme-toggle:hover {
      background: var(--site-surface-soft);
      color: var(--site-accent);
      transform: rotate(6deg);
    }

    @media screen and (min-width: 601px) {
      .site-nav {
        float: left;
      }

      .site-nav .page-link {
        box-sizing: border-box;
        display: inline-block;
        padding: 19px 3px 16px;
        border-bottom: 3px solid transparent;
        color: var(--site-muted);
        font-weight: 500;
        line-height: 1.4;
        transition: border-color 160ms ease, color 160ms ease;
      }

      .site-nav .page-link:hover {
        color: var(--site-accent);
        text-decoration: none;
      }

      .site-nav .page-link.active {
        border-bottom-color: var(--site-accent);
        color: var(--site-accent);
        font-weight: 650;
      }
    }

    .page-shell {
      padding-top: 18px;
    }

    .post-content p,
    .post-content li {
      line-height: 1.7;
    }

    blockquote {
      color: var(--site-muted);
      border-left-color: var(--site-border);
    }

    .post-meta,
    figcaption {
      color: var(--site-muted-soft);
    }

    table {
      color: var(--site-text);
      border-color: var(--site-border);
    }

    table tr:nth-child(even),
    table th {
      background-color: var(--site-surface-soft);
    }

    table th,
    table td {
      border-color: var(--site-border);
    }

    pre, code, .highlighter-rouge .highlight {
      background: var(--site-surface-muted);
      border-color: var(--site-border);
    }

    :focus-visible {
      outline: 3px solid var(--site-accent);
      outline-offset: 3px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --site-bg: #101418;
      --site-surface: #171d23;
      --site-surface-soft: #181f22;
      --site-surface-muted: #20282d;
      --site-hero-start: #161f21;
      --site-hero-end: #141a20;
      --site-text: #d8e1ea;
      --site-heading: #f1f5f9;
      --site-muted: #a8b5c3;
      --site-muted-soft: #93a4b5;
      --site-border: #303b47;
      --site-border-strong: #477976;
      --site-accent: #58c9bd;
      --site-accent-strong: #83ddd4;
      --site-accent-soft: #183c39;
      --site-button-text: #0d1822;
      --site-shadow: rgba(0, 0, 0, 0.3);
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --site-bg: #101418;
        --site-surface: #171d23;
        --site-surface-soft: #181f22;
        --site-surface-muted: #20282d;
        --site-hero-start: #161f21;
        --site-hero-end: #141a20;
        --site-text: #d8e1ea;
        --site-heading: #f1f5f9;
        --site-muted: #a8b5c3;
        --site-muted-soft: #93a4b5;
        --site-border: #303b47;
        --site-border-strong: #477976;
        --site-accent: #58c9bd;
        --site-accent-strong: #83ddd4;
        --site-accent-soft: #183c39;
        --site-button-text: #0d1822;
        --site-shadow: rgba(0, 0, 0, 0.3);
      }
    }

    .site-nav .menu-icon > svg {
      fill: var(--site-heading);
    }

    :root[data-theme="dark"] .highlight {
      background: var(--site-surface);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .highlight {
        background: var(--site-surface);
      }
    }

    @media screen and (max-width: 600px) {
      .site-header {
        min-height: 49px;
      }

      .wrapper {
        box-sizing: border-box;
        max-width: none;
        padding-right: calc(18px + env(safe-area-inset-right));
        padding-left: calc(18px + env(safe-area-inset-left));
      }

      .page-content {
        padding: 18px 0 24px;
      }

      .page-shell {
        padding-top: 4px;
      }

      .site-nav {
        top: 6px;
        right: calc(58px + env(safe-area-inset-right));
        z-index: 10;
        line-height: 1.4;
        background: transparent;
        border: 0;
        box-shadow: none;
      }

      .site-nav .trigger {
        position: absolute;
        top: 41px;
        right: 0;
        min-width: 142px;
        padding: 6px;
        background: var(--site-surface);
        border: 1px solid var(--site-border);
        border-radius: 12px;
        box-shadow: 0 10px 28px var(--site-shadow);
        text-align: left;
      }

      .site-nav input:checked ~ .trigger {
        padding: 6px;
      }

      .site-nav .page-link {
        margin: 0;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .site-nav .page-link:hover,
      .site-nav .page-link.active {
        background: var(--site-accent-soft);
        color: var(--site-accent);
        text-decoration: none;
      }

      .theme-toggle {
        position: absolute;
        top: 8px;
        right: calc(18px + env(safe-area-inset-right));
        float: none;
        width: 32px;
        height: 32px;
        margin: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
