name: Update Spotify data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-spotify.yml
      - docs/scripts/spotify_authorize.py
      - docs/scripts/update_spotify_analytics.py
  schedule:
    - cron: "15 */2 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the website
        uses: actions/checkout@v5

      - name: Select today's playlist and track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: >-
          python3 docs/scripts/update_spotify_pick.py
          --playlists docs/_data/spotify_playlists.json
          --output docs/_data/spotify_pick.json

      - name: Refresh private music analytics
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: >-
          python3 docs/scripts/update_spotify_analytics.py
          --playlists docs/_data/spotify_playlists.json
          --output docs/_data/music_analytics.json

      - name: Publish Spotify data
        run: |
          if git diff --quiet -- docs/_data/spotify_pick.json docs/_data/music_analytics.json; then
            echo "Spotify data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_data/spotify_pick.json docs/_data/music_analytics.json
          git commit -m "Update Spotify data"
          git push
